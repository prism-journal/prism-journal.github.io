# Supabase free-tier projects are paused after ~7 days without traffic, which
# would make the submission portal look broken to an author. This pings the
# project twice a week to keep it awake.
#
# It reads the project URL and anon key straight out of portal.html so there is
# only ever one place to change them. Both values are public by design.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Supabase config from portal.html
        id: cfg
        run: |
          URL=$(grep -oE 'url:[[:space:]]*"https://[a-z0-9]+\.supabase\.co"' portal.html \
                | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -1)
          KEY=$(grep -oE 'anonKey:[[:space:]]*"[A-Za-z0-9._-]+"' portal.html \
                | sed -E 's/.*"([A-Za-z0-9._-]+)".*/\1/' | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase is not configured in portal.html yet — nothing to ping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Ping
        if: steps.cfg.outputs.skip != 'true'
        run: |
          # The step runs under `bash -e`, so a failing curl would abort before
          # the diagnostic echo below and leave the log saying only "exit 6".
          # Capture the exit code deliberately and report what it means.
          set +e
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/rest/v1/journal_settings?select=id&limit=1" 2>curl.err)
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "curl exited $rc"
            cat curl.err || true
            case "$rc" in
              6)  echo "::error::DNS cannot resolve ${{ steps.cfg.outputs.url }}. Supabase withdraws the project hostname while a project is paused, so this is what a paused project looks like from outside — and it is exactly what this workflow exists to catch. Open the Supabase dashboard and resume the project. If it has been deleted rather than paused, create a new one, apply supabase/schema.sql, and update the url and anonKey in portal.html. Note that negative DNS answers are cached, so the host can keep returning NXDOMAIN for a while after a resume." ;;
              7)  echo "::error::Host resolves but refused the connection — project is down rather than gone." ;;
              28) echo "::error::Request timed out — project may be waking, or the network is blocked." ;;
              35|60) echo "::error::TLS failure talking to Supabase." ;;
              *)  echo "::error::curl failed with exit $rc; see the message above." ;;
            esac
            exit 1
          fi

          echo "Ping returned HTTP $code"
          # journal_settings is granted to anon (schema.sql), so a healthy
          # project answers 200 with a row. Pinging a table anon cannot read
          # returns 401 without the query ever reaching the database, which may
          # not register as activity — which is how the project paused on 24 Aug
          # despite this workflow reporting success.
          case "$code" in
            200) echo "Project is awake and served a real query." ;;
            401|403) echo "::warning::Reachable, but the ping was refused before touching the database. Check that journal_settings is still granted to anon." ;;
            *) echo "::error::Supabase answered but returned HTTP $code"; exit 1 ;;
          esac
