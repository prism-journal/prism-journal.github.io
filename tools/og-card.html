<!doctype html>
<meta charset="utf-8">
<title>PRISM — social card</title>
<!--
  The 1200x630 card behind og.png. Screenshot this file at exactly 1200x630 to
  regenerate it:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --screenshot=og.png --window-size=1200,630 file://$PWD/tools/og-card.html

  The mark is the one in assets/, not a separate drawing, so the card cannot
  drift away from the logo.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0B090A;
    color: #F6F2F3;
    display: grid;
    grid-template-columns: 1fr 440px;
    align-items: center;
    font-family: "Hoefler Text", "Iowan Old Style", Palatino, Georgia, serif;
  }
  .text { padding: 0 0 0 76px; }
  .wordmark { font-size: 108px; line-height: .9; letter-spacing: .055em; margin: 0; font-weight: 400; }
  .sub { font-size: 30px; line-height: 1.32; margin: 26px 0 0; max-width: 17em; color: #E6DFE1; }
  .rule { width: 200px; height: 3px; background: #C4213D; margin: 34px 0 26px; }
  .claims, .url {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .claims { font-size: 17px; line-height: 1.75; color: #9A8E93; }
  .url { font-size: 15px; color: #6E6468; margin-top: 44px; letter-spacing: .1em; text-transform: none; }
  .art { display: flex; align-items: center; justify-content: center; padding-right: 54px; }
  .art svg { width: 100%; height: auto; }
</style>
<div class="text">
  <p class="wordmark">PRISM</p>
  <p class="sub">A multidisciplinary journal of secondary-school research</p>
  <div class="rule"></div>
  <div class="claims">Open access<br>Transparent review<br>No fees</div>
  <div class="url">prism-journal.github.io</div>
</div>
<div class="art"><svg xmlns="http://www.w3.org/2000/svg" width="877" height="512" viewBox="0 0 877 512" role="img" aria-label="PRISM"><title>PRISM</title><desc>A ray refracted through an equilateral prism and dispersed into six lines, one for each section of the journal. The path is traced through N-BK7 glass at 50 degrees incidence on a 60 degree apex, close enough to minimum deviation that the ray inside the glass runs parallel to the base. The fan's angular spread is magnified about its mean for legibility; the spacing between the six lines is left at its physical ratio, so red crowds and violet runs wide, as it does in the real spectrum.</desc><defs><linearGradient id="lib" x1="73.36" y1="332.18" x2="295.32" y2="251.39" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F6F2F3" stop-opacity="0.2"/><stop offset="1" stop-color="#F6F2F3" stop-opacity="1"/></linearGradient></defs><line x1="73.36" y1="332.18" x2="295.32" y2="251.39" stroke="url(#lib)" stroke-width="52.24" stroke-linecap="round"/><line x1="537.93" y1="268.00" x2="714.57" y2="457.30" stroke="#6E3AD6" stroke-width="56.78" stroke-linecap="round"/><line x1="541.81" y1="263.24" x2="762.71" y2="398.30" stroke="#2E5FE0" stroke-width="56.78" stroke-linecap="round"/><line x1="543.54" y1="259.79" x2="784.11" y2="355.51" stroke="#0E93B8" stroke-width="56.78" stroke-linecap="round"/><line x1="544.57" y1="256.49" x2="796.88" y2="314.59" stroke="#2E9B4F" stroke-width="56.78" stroke-linecap="round"/><line x1="545.08" y1="253.13" x2="803.24" y2="272.95" stroke="#D89A16" stroke-width="56.78" stroke-linecap="round"/><line x1="545.12" y1="250.15" x2="803.64" y2="235.95" stroke="#D2542E" stroke-width="56.78" stroke-linecap="round"/><path d="M 408.88 54.70 L 636.00 448.08 L 181.76 448.08 Z" fill="#F6F2F3"/><line x1="295.32" y1="251.39" x2="522.44" y2="251.39" stroke="#0B090A" stroke-width="24.98" stroke-linecap="round"/></svg>
</div>
