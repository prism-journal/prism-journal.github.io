<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PRISM"><title>PRISM</title><desc>A ray refracted through an equilateral prism and dispersed into six lines, one for each section of the journal. The path is traced through N-BK7 glass at 50 degrees incidence on a 60 degree apex, close enough to minimum deviation that the ray inside the glass runs parallel to the base. The fan's angular spread is magnified about its mean for legibility; the spacing between the six lines is left at its physical ratio, so red crowds and violet runs wide, as it does in the real spectrum.</desc><rect width="512" height="512" fill="#FBFAF9"/><defs><linearGradient id="ib" x1="62.89" y1="293.86" x2="166.90" y2="256.00" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0B090A" stop-opacity="0.2"/><stop offset="1" stop-color="#0B090A" stop-opacity="1"/></linearGradient></defs><line x1="62.89" y1="293.86" x2="166.90" y2="256.00" stroke="url(#ib)" stroke-width="35.97" stroke-linecap="round"/><line x1="313.54" y1="267.08" x2="391.47" y2="371.20" stroke="#6E3AD6" stroke-width="38.74" stroke-linecap="round"/><line x1="316.69" y1="263.78" x2="424.26" y2="336.87" stroke="#2E5FE0" stroke-width="38.74" stroke-linecap="round"/><line x1="318.05" y1="261.25" x2="438.39" y2="310.56" stroke="#0E93B8" stroke-width="38.74" stroke-linecap="round"/><line x1="318.80" y1="258.79" x2="446.19" y2="284.97" stroke="#2E9B4F" stroke-width="38.74" stroke-linecap="round"/><line x1="319.08" y1="256.27" x2="449.11" y2="258.84" stroke="#D89A16" stroke-width="38.74" stroke-linecap="round"/><line x1="318.95" y1="254.06" x2="447.71" y2="235.78" stroke="#D2542E" stroke-width="38.74" stroke-linecap="round"/><path d="M 236.07 136.18 L 374.43 375.82 L 97.72 375.82 Z" fill="#0B090A"/><line x1="166.90" y1="256.00" x2="305.25" y2="256.00" stroke="#FBFAF9" stroke-width="17.16" stroke-linecap="round"/></svg>
